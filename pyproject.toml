[project]
name = "a1-cost-tracker"
version = "0.1.0"
description = "A Python application that compares AI provider responses, token usage, and API costs."
readme = "README.md"
authors = [
    { name = "Hijab Fareed", email = "185679365+hijabfareed@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.5.0",
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
a1-cost-tracker = "a1_cost_tracker:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
